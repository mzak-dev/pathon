[package]
name = "pathon-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Examples play the host: they may use wgpu and winit directly, like an own engine would.
[dependencies]
bytemuck.workspace = true
gltf.workspace = true
log.workspace = true
pathon.workspace = true
pathon-api.workspace = true
pathon-bindless.workspace = true
pathon-debug.workspace = true
pathon-devtools.workspace = true
pathon-ibl.workspace = true
pathon-golden.workspace = true
pathon-hot.workspace = true
pathon-material.workspace = true
pathon-mesh.workspace = true
pathon-pbr.workspace = true
pathon-post.workspace = true
pathon-profile.workspace = true
pathon-texture.workspace = true
pathon-rhi-wgpu.workspace = true
pathon-scene.workspace = true
pathon-shadow.workspace = true
pathon-shader.workspace = true
pathon-skin.workspace = true
pathon-test.workspace = true
png.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zune-jpeg.workspace = true
wgpu.workspace = true
winit.workspace = true

[features]
gpu-tests = []
window-tests = []
# Streams the passes of the `profile` example to a profiler (needs the matching viewer, docs/crates/pathon-profile.md).
tracy = ["pathon-profile/tracy"]
puffin = ["pathon-profile/puffin"]
tracing = ["pathon-profile/tracing"]

[lints]
workspace = true

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "recording"
harness = false

[[test]]
name = "window_events"
harness = false
required-features = ["window-tests"]

[[test]]
name = "surface_reconfigure"
harness = false
required-features = ["window-tests"]
