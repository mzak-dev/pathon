name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (null backend)
        run: cargo test --workspace
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format (nightly rustfmt for import grouping)
        run: cargo +nightly fmt --all -- --check
      - name: Dependency boundaries
        run: cargo xtask deps-check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Core builds for the web (single thread, no platform)
        run: cargo check --target wasm32-unknown-unknown -p pathon-core -p pathon-test -p pathon-shader -p pathon --no-default-features
      - name: Lint the web runner, platform and example
        run: cargo clippy --target wasm32-unknown-unknown -p pathon -p pathon-platform-winit -p pathon-example-web -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the web example (release)
        run: wasm-pack build examples/web --release --target web
      - name: WASM size report
        run: |
          wasm=examples/web/pkg/pathon_example_web_bg.wasm
          echo "### WASM size" >> "$GITHUB_STEP_SUMMARY"
          echo "- raw: $(stat -c %s "$wasm") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- gzip: $(gzip -c "$wasm" | wc -c) bytes" >> "$GITHUB_STEP_SUMMARY"

  gpu:
    runs-on: ubuntu-latest
    env:
      # Lavapipe is installed below: a missing adapter must fail the golden tests, not skip them.
      PATHON_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers gdb
      - name: GPU tests on lavapipe
        # Core dumps let the next step print where a driver crash (SIGSEGV) happened.
        # Serial tests: the Ubuntu 24.04 Vulkan loader races vkSetDebugUtilsObjectNameEXT against
        # vkCreateDevice/vkDestroyDevice on other threads and segfaults.
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          ulimit -c unlimited
          cargo test --workspace --all-features -- --test-threads=1
      - name: Backtrace of crashed tests
        if: failure()
        run: |
          for core in /tmp/core.*; do
            [ -e "$core" ] || continue
            exe=$(gdb -batch -c "$core" 2>/dev/null | sed -n "s/^Core was generated by \`\([^ ']*\).*/\1/p")
            gdb -batch -ex "thread apply all bt" "$exe" "$core"
          done
      - name: Golden image artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts-lavapipe
          path: target/golden-artifacts
          if-no-files-found: ignore

  # The same golden tests on the other backends (ADR-0025). Linux with lavapipe runs them in the `gpu` job above.
  golden:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GPU on the hosted runner: wgpu falls back to WARP ("Microsoft Basic Render Driver") on DX12.
          - os: windows-latest
            name: warp
            require_gpu: "1"
          # Hosted macOS runners are VMs and may not expose Metal: a missing adapter skips the test with a warning
          # annotation instead of failing; the skip is loud (--nocapture), never a silent pass.
          - os: macos-latest
            name: metal
            require_gpu: "0"
    runs-on: ${{ matrix.os }}
    env:
      PATHON_REQUIRE_GPU: ${{ matrix.require_gpu }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Golden tests (${{ matrix.name }})
        # bash stops at the first failing cargo call; the default PowerShell on Windows would not.
        shell: bash
        run: |
          cargo test -p pathon-golden --features gpu-tests -- --test-threads=1 --nocapture
          cargo test -p pathon-core --features gpu-tests --test vertical_slice_gpu unlit_cube_matches_its_golden_image -- --test-threads=1 --nocapture
      - name: Golden image artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts-${{ matrix.name }}
          path: target/golden-artifacts
          if-no-files-found: ignore
