[workspace]
resolver = "3"
members = ["crates/*", "examples", "examples/web", "tools/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mzak-dev/pathon"

[workspace.dependencies]
pathon = { path = "crates/pathon" }
pathon-api = { path = "crates/pathon-api" }
pathon-core = { path = "crates/pathon-core" }
pathon-diag = { path = "crates/pathon-diag" }
pathon-golden = { path = "crates/pathon-golden" }
pathon-graph = { path = "crates/pathon-graph" }
pathon-material = { path = "crates/pathon-material" }
pathon-mesh = { path = "crates/pathon-mesh" }
pathon-platform = { path = "crates/pathon-platform" }
pathon-platform-winit = { path = "crates/pathon-platform-winit" }
pathon-profile = { path = "crates/pathon-profile" }
pathon-resources = { path = "crates/pathon-resources" }
pathon-rhi = { path = "crates/pathon-rhi" }
pathon-rhi-null = { path = "crates/pathon-rhi-null" }
pathon-rhi-types = { path = "crates/pathon-rhi-types" }
pathon-rhi-wgpu = { path = "crates/pathon-rhi-wgpu" }
pathon-scene = { path = "crates/pathon-scene" }
pathon-shader = { path = "crates/pathon-shader" }
pathon-test = { path = "crates/pathon-test" }
pathon-texture = { path = "crates/pathon-texture" }
pathon-devtools = { path = "tools/pathon-devtools" }

bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-channel = "0.5"
divan = "0.1"
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
# Without "underline-color": its weak `ratatui-termwiz?/` feature makes cargo metadata list termwiz (WTFPL) as resolved.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
png = "0.18"
puffin = "0.20"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Localhost only: a profiled build must not open Tracy's port to the network; the other defaults (system tracing, sampling) need elevated rights.
tracy-client = { version = "0.19", default-features = false, features = ["enable", "only-localhost"] }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "vulkan",
    "wgsl",
    "webgpu",
] }
winit = "0.30"
wesl = { version = "0.6", default-features = false, features = ["naga-ext"] }

# Web only (ADR-0014).
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
mod_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stdout = "warn"
print_stderr = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
rc_buffer = "warn"
clone_on_ref_ptr = "warn"
infinite_loop = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
wildcard_imports = "warn"
needless_for_each = "warn"
float_cmp = "warn"
