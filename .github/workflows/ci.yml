name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (null backend)
        run: cargo test --workspace
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format (nightly rustfmt for import grouping)
        run: cargo +nightly fmt --all -- --check
      - name: Dependency boundaries
        run: cargo xtask deps-check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Core builds for the web (single thread, no platform)
        run: cargo check --target wasm32-unknown-unknown -p pathon-core -p pathon-test -p pathon --no-default-features
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the web example (release)
        run: wasm-pack build examples/web --release --target web
      - name: WASM size report
        run: |
          wasm=examples/web/pkg/pathon_example_web_bg.wasm
          echo "WASM raw: $(stat -c %s "$wasm") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "WASM gzip: $(gzip -c "$wasm" | wc -c) bytes" >> "$GITHUB_STEP_SUMMARY"

  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: GPU tests on lavapipe
        run: cargo test --workspace --all-features
