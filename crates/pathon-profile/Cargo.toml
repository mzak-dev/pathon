[package]
name = "pathon-profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A tool, not a pack: it watches the renderer through `FrameObserver`, so the core never depends on it (ADR-0026).
[dependencies]
pathon-api.workspace = true
pathon-diag.workspace = true
tracing = { workspace = true, optional = true }

# Tracy has no web client, and puffin's clock needs extra setup there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
puffin = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
pathon-core.workspace = true
pathon-rhi.workspace = true
pathon-test.workspace = true

[features]
tracing = ["dep:tracing"]
tracy = ["dep:tracy-client"]
puffin = ["dep:puffin"]
gpu-tests = []

[lints]
workspace = true
