name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (null backend)
        run: cargo test --workspace
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format (nightly rustfmt for import grouping)
        run: cargo +nightly fmt --all -- --check
      - name: Dependency boundaries
        run: cargo xtask deps-check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Core builds for the web (single thread, no platform)
        run: cargo check --target wasm32-unknown-unknown -p pathon-core -p pathon-test -p pathon-shader -p pathon-mesh -p pathon-profile -p pathon --no-default-features
      - name: Lint the web runner, platform and example
        run: cargo clippy --target wasm32-unknown-unknown -p pathon -p pathon-platform-winit -p pathon-example-web -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the web example (release)
        run: wasm-pack build examples/web --release --target web
      - name: WASM size report
        run: |
          wasm=examples/web/pkg/pathon_example_web_bg.wasm
          echo "### WASM size" >> "$GITHUB_STEP_SUMMARY"
          echo "- raw: $(stat -c %s "$wasm") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- gzip: $(gzip -c "$wasm" | wc -c) bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium for the browser check
        run: |
          mkdir -p "$RUNNER_TEMP/browser-check"
          cd "$RUNNER_TEMP/browser-check"
          npm init -y > /dev/null
          npm install playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Web example in Chromium (async device, frames, clear colour, Caps vs navigator.gpu)
        # Exit code 2 means the runner's Chromium has no WebGPU adapter (software WebGPU is not guaranteed on hosted
        # runners): the step is allowed to fail so the job still reports the build, the failure is in the log.
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/browser-check/node_modules
          PATHON_CHROME_CHANNEL: chromium
          PATHON_CHROME_ARGS: --no-sandbox --enable-unsafe-webgpu --use-webgpu-adapter=swiftshader --enable-features=Vulkan --use-angle=swiftshader --disable-gpu-sandbox --ignore-gpu-blocklist
        run: |
          site="$RUNNER_TEMP/web-site"
          mkdir -p "$site"
          cp examples/web/index.html "$site/"
          cp -r examples/web/pkg "$site/pkg"
          node examples/web/verify.cjs "$site"

  gpu:
    runs-on: ubuntu-latest
    env:
      # Lavapipe is installed below: a missing adapter must fail the golden tests, not skip them.
      PATHON_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers gdb
      - name: GPU tests on lavapipe
        # Core dumps let the next step print where a driver crash (SIGSEGV) happened.
        # Serial tests: the Ubuntu 24.04 Vulkan loader races vkSetDebugUtilsObjectNameEXT against
        # vkCreateDevice/vkDestroyDevice on other threads and segfaults.
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          ulimit -c unlimited
          export PATHON_CAPS_REPORT="$GITHUB_STEP_SUMMARY"
          cargo test --workspace --all-features -- --test-threads=1
      - name: Backtrace of crashed tests
        if: failure()
        run: |
          for core in /tmp/core.*; do
            [ -e "$core" ] || continue
            exe=$(gdb -batch -c "$core" 2>/dev/null | sed -n "s/^Core was generated by \`\([^ ']*\).*/\1/p")
            gdb -batch -ex "thread apply all bt" "$exe" "$core"
          done
      - name: Golden image artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts-lavapipe
          path: target/golden-artifacts
          if-no-files-found: ignore

  # The same golden tests on the other backends (ADR-0025). Linux with lavapipe runs them in the `gpu` job above.
  golden:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GPU on the hosted runner: wgpu falls back to WARP ("Microsoft Basic Render Driver") on DX12.
          - os: windows-latest
            name: warp
            require_gpu: "1"
          # Hosted macOS runners are VMs and may not expose Metal: a missing adapter skips the test with a warning
          # annotation instead of failing; the skip is loud (--nocapture), never a silent pass.
          - os: macos-latest
            name: metal
            require_gpu: "0"
    runs-on: ${{ matrix.os }}
    env:
      PATHON_REQUIRE_GPU: ${{ matrix.require_gpu }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Golden tests (${{ matrix.name }})
        # bash stops at the first failing cargo call; the default PowerShell on Windows would not.
        shell: bash
        run: |
          cargo test -p pathon-golden --features gpu-tests -- --test-threads=1 --nocapture
          cargo test -p pathon-core --features gpu-tests --test vertical_slice_gpu unlit_cube_matches_its_golden_image -- --test-threads=1 --nocapture
      - name: Golden image artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts-${{ matrix.name }}
          path: target/golden-artifacts
          if-no-files-found: ignore

  # M0-08 / M1-01 / M2-11: the whole GPU suite on Metal (Apple Silicon runner). The Caps test comes first and its report
  # (per backend, compared with raw wgpu) lands in the job summary.
  gpu-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Caps and adopt on Metal
        run: |
          export PATHON_CAPS_REPORT="$GITHUB_STEP_SUMMARY"
          cargo test -p pathon-rhi-wgpu --features gpu-tests --test caps_report -- --test-threads=1 --nocapture
      - name: GPU tests on Metal (RHI conformance, core with the runner, host seam)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features -- --test-threads=1

  # M0-05 / M0-10: real windows. `window_events` resizes a window from code and waits for the Resized event;
  # `clear` renders to a window and exits by itself after N frames. Linux runs under Xvfb on lavapipe.
  window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PATHON_REQUIRE_WINDOW: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 libxcb1
      - name: Build the window tests and examples
        run: |
          cargo test -p pathon-examples --features window-tests --test window_events --no-run
          cargo build -p pathon-examples --bin clear
      - name: Window events (Linux, X11 under Xvfb)
        if: runner.os == 'Linux'
        env:
          WINIT_UNIX_BACKEND: x11
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p pathon-examples --features window-tests --test window_events
          WINIT_X11_SCALE_FACTOR=1.5 PATHON_EXPECT_SCALE=1.5 xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p pathon-examples --features window-tests --test window_events
      - name: clear for 120 frames (Linux, X11 under Xvfb, lavapipe)
        if: runner.os == 'Linux'
        env:
          WINIT_UNIX_BACKEND: x11
          PATHON_EXIT_AFTER_FRAMES: "120"
        run: timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" cargo run -p pathon-examples --bin clear 2>&1 | tee clear.log && grep -q "rendered 120 frames" clear.log
      - name: Window events (macOS, Windows)
        if: runner.os != 'Linux'
        run: cargo test -p pathon-examples --features window-tests --test window_events
      - name: clear for 120 frames (macOS, Metal)
        if: runner.os == 'macOS'
        env:
          PATHON_EXIT_AFTER_FRAMES: "120"
        run: cargo run -p pathon-examples --bin clear 2>&1 | tee clear.log && grep -q "rendered 120 frames" clear.log

  # M0-05 on Wayland: a headless weston compositor. Experimental: nothing here guarantees a compositor on the runner,
  # so the job may fail without turning the workflow red; a green run is the evidence.
  window-wayland:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PATHON_REQUIRE_WINDOW: "1"
      WINIT_UNIX_BACKEND: wayland
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install weston and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y weston mesa-vulkan-drivers libwayland-client0 libxkbcommon0
      - name: Build
        run: |
          cargo test -p pathon-examples --features window-tests --test window_events --no-run
          cargo build -p pathon-examples --bin clear
      - name: Start a headless Wayland compositor
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-ci --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          for _ in $(seq 20); do [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break; sleep 0.5; done
          ls -l "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wl-ci" >> "$GITHUB_ENV"
      - name: Window events (Wayland)
        run: env -u DISPLAY cargo test -p pathon-examples --features window-tests --test window_events
      - name: clear for 120 frames (Wayland, lavapipe)
        env:
          PATHON_EXIT_AFTER_FRAMES: "120"
        run: env -u DISPLAY timeout 180 cargo run -p pathon-examples --bin clear 2>&1 | tee clear.log && grep -q "rendered 120 frames" clear.log
      - name: Compositor log
        if: always()
        run: cat "$RUNNER_TEMP/weston.log" || true
