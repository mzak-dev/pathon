[package]
name = "pathon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
pathon-api.workspace = true
pathon-core.workspace = true
pathon-diag.workspace = true
pathon-platform = { workspace = true, optional = true }
pathon-platform-winit = { workspace = true, optional = true }
pathon-rhi.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCollection", "Navigator", "Performance", "Window"] }

[features]
default = ["winit"]
runtime = ["dep:pathon-platform", "dep:crossbeam-channel"]
winit = ["runtime", "dep:pathon-platform-winit"]

[lints]
workspace = true
